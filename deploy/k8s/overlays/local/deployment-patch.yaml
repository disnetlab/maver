# Never pull: the image is built on the machine and side-loaded with
# `kind load docker-image`, and IfNotPresent would still reach for a registry the first
# time the tag is missing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maver
  namespace: maver
spec:
  template:
    spec:
      containers:
        - name: maver
          imagePullPolicy: Never
          # Sized for one kind node sharing a laptop, not for a cluster.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 500Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
