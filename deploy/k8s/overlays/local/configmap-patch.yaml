# A null removes the key. Unsetting a telemetry endpoint withdraws the tools that would
# have used it, before the run and with the reason recorded, which is what should happen
# on a cluster that has no Prometheus rather than every metrics call returning an error
# a role then tries to work around.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maver-config
  namespace: maver
data:
  MAVER_TRANSPORT__PROMETHEUS_URL: null
  MAVER_TRANSPORT__LOKI_URL: null
  MAVER_TRANSPORT__JAEGER_URL: null
  MAVER_OBSERVABILITY__OTLP_ENDPOINT: null
  MAVER_OBSERVABILITY__LOG_LEVEL: "DEBUG"
  # The image sets production, which hides the OpenAPI docs. Locally they are the
  # cheapest way to see what the API actually accepts.
  MAVER_SERVER__ENVIRONMENT: "local"
  # Memory stays on, so the local path exercises the same retrieval the measurements
  # ran on, but nothing distils in the background of a five-minute demonstration.
  MAVER_MEMORY__LEARNING_ENABLED: "false"
