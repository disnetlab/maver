# Only what a real cluster's own addresses and identity change. Every other key comes
# from the base, and a patch is a merge: the keys not named here keep their base values
# rather than being dropped, which is the difference between applying an overlay with
# `-k` and applying this file with `-f`.
#
# The memory backend deliberately stays `embedded`. `postgres` is implemented and is the
# right choice for a deployment whose records have to outlive the pod, but it needs the
# image built with the postgres extra and `MAVER_MEMORY__POSTGRES_DSN` in the secret;
# without both, the storage factory refuses it at startup rather than at the first
# incident. Switching this key alone would produce a pod that cannot start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maver-config
  namespace: maver
data:
  # Names this deployment in traces and in every run's configuration snapshot, which is
  # what lets two clusters' results be told apart afterwards.
  MAVER_OBSERVABILITY__DEPLOYMENT_ID: "maver-production"
  MAVER_OBSERVABILITY__LOG_LEVEL: "INFO"
