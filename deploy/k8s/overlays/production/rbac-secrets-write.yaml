# Opt-in, and left out of kustomization.yaml so that opting in is an edit somebody makes
# on purpose.
#
# What it costs: a Secret in a workload namespace holds ServiceAccount tokens, database
# passwords and TLS keys, and something that can rewrite them can mint credentials for
# itself and escalate out of every other boundary in this directory. No fault family
# this system reports needs it, which is why it left the default write role.
#
# The read half is the same escalation with an extra step, so it is here too: `get` and
# `list` on secrets return their values, not their names. Granting read alone restores
# one line of the namespace snapshot — the check for a workload referring to a secret
# that does not exist — and nothing else.
#
# To use: add this file to kustomization.yaml's resources, and bind the role you want
# with a RoleBinding per namespace, the way rolebindings.example.yaml does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kira-namespace-secrets-read
  labels:
    app.kubernetes.io/name: kira
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kira-namespace-secrets-write
  labels:
    app.kubernetes.io/name: kira
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
