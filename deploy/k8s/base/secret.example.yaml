# A template. It is deliberately excluded from kustomization.yaml, so `kubectl apply -k`
# never applies these placeholder values over a real secret.
#
# Create the real one out of band, which also keeps it out of the repository:
#
#   kubectl create secret generic maver-secrets \
#     --namespace maver \
#     --from-literal=MAVER_MODEL__API_KEY="$MAVER_MODEL__API_KEY"
#
# The Deployment reads it with `envFrom`, marked optional, so a deployment against a
# private model endpoint that needs no key can leave the Secret out entirely.
#
# Environment rather than files, and that is a compromise worth naming. A secret in the
# environment appears in printenv, in /proc/<pid>/environ and in a crash dump, so the
# intended design is a projected mount that the settings layer reads a file per key
# from. The settings layer has no secrets directory configured yet, so a mount here
# would be inert — the key would simply never be read, and the model call would fail
# with no manifest to blame. This changes to a projected mount when that lands.
#
# A second key, MAVER_MEMORY__POSTGRES_DSN, belongs here for a deployment that sets
# MAVER_MEMORY__BACKEND=postgres. It is left out of the example because the base overlay
# runs the embedded backend, and a connection string nothing reads is a credential kept
# for no reason.
apiVersion: v1
kind: Secret
metadata:
  name: maver-secrets
  namespace: maver
  labels:
    app.kubernetes.io/name: maver
type: Opaque
stringData:
  MAVER_MODEL__API_KEY: "REPLACE_ME"
