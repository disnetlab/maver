apiVersion: v1
kind: ServiceAccount
metadata:
  name: maver
  namespace: maver
  labels:
    app.kubernetes.io/name: maver
# Off here, and turned on for the one pod that needs it. The token is what lets kubectl
# reach the API server from inside the cluster, so anything else that borrows this
# ServiceAccount — a debug pod, a Job someone writes later — gets the RBAC only if it
# asks for the token explicitly. A deployment whose tools reach the cluster through an
# environment adapter's own transport can leave it off in the pod too.
automountServiceAccountToken: false
