# The evaluation container the SREGym harness grades, and the only compose file in this
# repository that mentions a benchmark.
#
#   make compose-eval-up
#
# or, without make:
#
#   REVISION=$(git rev-parse HEAD) docker compose -f deploy/docker/docker-compose.eval.yml \
#     up -d --build --force-recreate
#
# Stand-alone rather than an override of docker-compose.yml: both publish 127.0.0.1:8080
# and merging them would leave one service under two names. Three names below are part
# of the harness's contract and none of them may drift — `k8s-agent:local` is what the
# harness's own rebuild step tags, `k8s-agent-sregym` is the container it POSTs to, and
# 127.0.0.1:8080 is where it looks for it. The tag says `k8s-agent` in a repository
# called maver for that reason alone.
#
# A deploy that only restarts the service grades stale code, because compose never
# recreates a container it did not just build: --force-recreate above is the rule, and
# `curl -fsS 127.0.0.1:8080/healthz | jq -r .revision` is how it is checked.
services:
  maver-eval:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BASE_IMAGE: python:3.12-slim
        # The commit the image records and /healthz reports, so a deploy can tell the
        # container it just built from a stale one nobody recreated. Compose cannot run
        # git itself, so the value is interpolated from the environment and
        # `make compose-eval-up` supplies it; a bare `docker compose build` falls back to the
        # same `unknown` the Dockerfile defaults to rather than failing.
        REVISION: ${REVISION:-unknown}
        VERSION: ${VERSION:-0.0.0+dev}
        EXTRAS: sregym
    image: k8s-agent:local
    container_name: k8s-agent-sregym
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - maver.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # The conductor and the MCP server are reached through port-forwards on the host.
    # A container-isolated agent talks to the docker bridge rather than to loopback, and
    # a forward bound only to 127.0.0.1 refuses its every call while the driver passes
    # its own preflight, so the failure reads as an agent fault.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MAVER_INTAKE__ADAPTERS: sregym
      MAVER_ADAPTERS__SREGYM__CONDUCTOR_BASE_URL: http://host.docker.internal:8000
      MAVER_ADAPTERS__SREGYM__MCP_BASE_URL: http://host.docker.internal:9954
      # kubectl runs locally against the harness's filtering proxy rather than through
      # the MCP server, and `scripts/sregym-mcp-port-forward.sh` binds that forward on
      # the docker bridge as well as on loopback for exactly this container.
      MAVER_ADAPTERS__SREGYM__KUBECTL_PROXY_URL: http://host.docker.internal:16444
      # Unattended Kubernetes writes: nobody is waiting to approve them during a sweep.
      # Kubectl exec retains its separate human-approval default. Reproducing historical
      # shell exec requires explicitly applying examples/sregym-unattended.yaml.
      MAVER_AUTHORITY__MODE: auto
      # And therefore not a production deployment. The settings layer refuses
      # environment=production with authority=auto, and the image bakes `production` in,
      # so without this line the container exits at startup on that invariant and the
      # harness reads it as a health-check timeout naming nothing. Said here rather than
      # dropped from the image, because the refusal is the safety property doing its job:
      # a benchmark host declares that it is not production, and that declaration lands
      # in every run's configuration snapshot beside the authority it ran under.
      MAVER_SERVER__ENVIRONMENT: local
    volumes:
      - maver-eval-workspace:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  maver-eval-workspace:
    name: "${MAVER_EVAL_WORKSPACE_VOLUME:-docker_kira-eval-workspace}"
