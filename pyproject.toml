[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kira"
version = "0.1.0"
description = "Kubernetes Incident Recovery Agent: a memory-augmented multi-agent pipeline for autonomous microservice incident recovery with privately served language models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yifeng Guo", email = "even0758@gmail.com" }]
keywords = [
    "kubernetes",
    "incident-response",
    "llm-agents",
    "site-reliability-engineering",
    "root-cause-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # Service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Model provider routing
    "litellm>=1.70",
    # Graph execution. Kept shallow on purpose: see STYLE_GUIDE.md.
    "langgraph>=1.0",
    # Cluster and telemetry access for the default (direct) transport
    "kubernetes>=31.0",
    "httpx>=0.28",
    # Scheduling for the asynchronous Learning stage and approval timeouts.
    # SQLAlchemy is here only as APScheduler's persistent job store: a distillation
    # scheduled minutes out must survive a restart, and losing one silently loses a
    # memory record.
    "apscheduler>=3.11",
    "sqlalchemy>=2.0",
    # Configuration and CLI
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.15",
    # Observability, present in every stage
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    # The Snowball English stemmer PostgreSQL's `english_stem` dictionary runs, so that
    # the embedded backend can build the same candidate pool as the server one. Pure
    # Python and dependency-free: see kira.memory.lexemes.
    "snowballstemmer>=3.1.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
vector = ["chromadb>=1.0"]
kafka = ["aiokafka>=0.12"]
sregym = ["mcp>=2.1", "httpx-sse>=0.4"]
all = ["kira[postgres,vector,kafka,sregym]"]

[project.scripts]
kira = "kira.cli:app"
# The harness spawns this as a subprocess and waits for it to exit. It is a console
# script so a fresh install has the path, and scripts/sregym-driver.py so the path a
# deployed harness already names keeps working.
kira-sregym-driver = "kira.adapters.sregym.driver:main"

# Extension seams. A third party ships a role, tool, ranker or environment adapter by
# declaring an entry point in these groups; no fork required. The module named by the
# entry point registers on import, and `validate_deployment` imports all of them before
# it checks anything, so a plugin is validated with the rest of the deployment.
#
# A role and a tool still need an allowlist entry to be reachable, and the allowlist is
# core: `kira.tools.allowlists.ROLE_TOOLSETS` is the mutable table a plugin module adds
# its own row to, or splices its tool name into, in the same import. A tool shipped this
# way carries its own `descriptions` rather than appearing in the packaged catalogue.
#
# There is no transports group: a transport is not selected by name anywhere. The core
# uses the direct one and an environment adapter supplies its own, so the adapter group
# below is the seam a third-party transport arrives through.
[project.entry-points."kira.roles"]

[project.entry-points."kira.tools"]

[project.entry-points."kira.rankers"]

[project.entry-points."kira.adapters"]
# Present in every install, including one without the sregym extra, so the module it
# names must import without the client library. The import that needs it is deferred.
sregym = "kira.adapters.sregym"
# No extra of its own: the bridge client is httpx, which is a core dependency, and
# AIOpsLab is an operator-supplied checkout rather than a package. The import that needs
# the bridge is deferred for the same reason as above.
aiopslab = "kira.adapters.aiopslab:ADAPTER"

[project.urls]
Homepage = "https://github.com/evenodderguy/kira"
Repository = "https://github.com/evenodderguy/kira"
Issues = "https://github.com/evenodderguy/kira/issues"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff==0.16.5", "mypy>=1.15", "types-PyYAML>=6.0"]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
]

[tool.uv]
required-version = ">=0.9"

[tool.hatch.build.targets.wheel]
packages = ["src/kira"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Local working state, not source. Ruff formats Python blocks inside Markdown, and
# reflowing the survey notes would destroy the aligned annotations that make them
# readable. The directory is gitignored and deleted once the specs land.
#
# The frozen prototype copy is evidence, not source: two of its files are Python, and
# they are byte-for-byte what the parity checks compare against. Formatting or fixing
# them would rewrite the thing being compared.
extend-exclude = ["refactor", "tests/fixtures/prototype"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "TID",    # flake8-tidy-imports (layer boundaries, see below)
    "PLC0415", # import at non-top-level
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# The suite has to be able to exercise an adapter. The rule it stands for is enforced
# over src/kira by an AST walk in tests/unit/test_adapters.py, which a lint rule cannot
# do for an adapter nobody has written yet or for an import taken by name.
"tests/unit/test_sregym_adapter.py" = ["TID251"]
# The shared transport contract runs against both transports, and one of them is an
# adapter's.
"tests/contract/test_transport_mcp.py" = ["TID251"]
# The AIOpsLab adapter's own tests, for the same two reasons.
"tests/unit/adapters/aiopslab/*" = ["TID251"]
"tests/contract/test_transport_aiopslab.py" = ["TID251"]
"src/kira/prompts/*" = ["D"]
# Field descriptions in the artifact schemas are shipped to the model as its
# submission tool's JSON Schema and are carried over verbatim. Their typographic
# characters are part of the frozen contract, not a style choice.
"src/kira/contracts/artifacts.py" = ["RUF001", "RUF002", "RUF003"]
"src/kira/orchestration/graph.py" = ["TID251"]  # the one module allowed to import it
"src/kira/llm/_provider.py" = ["TID251"]  # the one module allowed to import it
# An adapter's own modules are the one place its package may be imported from. The ban
# exists to stop the core naming an environment, not to stop an adapter being written.
"src/kira/adapters/sregym/*" = ["TID251"]
"src/kira/adapters/aiopslab/*" = ["TID251"]
"tests/unit/test_aiopslab_adapter.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["kira"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Layer boundaries, enforced. The core must never know which benchmark or
# environment it is running under; an adapter supplies its transport instead.
# See STYLE_GUIDE.md "Layer boundaries".
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"kira.adapters.sregym".msg = "Core modules must not import an adapter. Adapters register via the kira.adapters entry-point group and supply their own transport."
"kira.adapters.aiopslab".msg = "Core modules must not import an adapter. Adapters register via the kira.adapters entry-point group and supply their own transport."
"langgraph".msg = "Only kira.orchestration.graph may import the graph executor. Routing lives in routing.py and is framework-free; see STYLE_GUIDE.md 'LangGraph containment'."
"litellm".msg = "Only kira.llm._provider may import the provider library; it owns the import-time environment write the library requires. Use kira.llm types instead."

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "langgraph.*",
    "chromadb.*",
    "apscheduler.*",
    "kubernetes.*",
    "snowballstemmer.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a live cluster, database or model endpoint",
    "slow: deselect with -m 'not slow'",
    # The checks that guard the published numbers, selectable on their own so a
    # reviewer can run exactly those. A test earns this marker when its expectation
    # was taken from the prototype or from an archived measurement, and not when it
    # merely covers the same area: `make test-parity`.
    "parity: pins behaviour measured on the research prototype",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
