schema_version: 1
name: ma-r
label: MA+R
description: >
  The earlier second-opinion variant. A nominator maps retrieved precedents to one of
  eleven operational fault families and serves as the gate: a verdict that the family
  differs both triggers the second diagnosis and supplies its content. The second run
  receives a verify-or-falsify assignment and no precedent text.
model_profile: qwen3.6-35b-a3b
frozen: false
registered:
  date: "2026-08-09"
  campaign: second_opinion
  hypothesis: "memory helps as a candidate nominator rather than as context"
settings:
  pipeline:
    mode: multi
    max_turns: 100
    remediation_retries: 2
    auto_snapshot: true
  memory:
    enabled: true
    role_retrieval: true
    learning_enabled: true
    top_k: 5
    min_score_per_token: 0.0
    second_pass:
      enabled: true
      gate: nominator
      delivery: assignment
      force: false
      max_precedents: 6
      nominator_max_tokens: 900
      selector_max_tokens: 1600
      selector_timeout_s: 180
  verify: {enabled: false}
holds_constant:
  - model_profile
  - runtime.*
  - pipeline.max_turns
not_reproducible:
  - >
    Its retrieval. The campaign ran a hybrid ranker blending vector similarity at 0.6 with
    lexical score at 0.4. Kira ships lexical ranking only, because an offline sweep over
    this corpus found it the ceiling, so this file cannot express what that campaign
    retrieved with. A vector ranker registered in the `kira.rankers` group could.
  - >
    Its decoding, for the same reason as the single-agent arm: a frequency penalty of 0.3
    and a 300-second request timeout, both of which belong to a profile of their own.
  - >
    Its playbook. The campaign ran with the always-injected Global layer on, and that
    layer is not in this build — it is absent from the published system description and
    shipped on and undocumented in the prototype.
notes: >
  Not one of the manuscript's configurations, and a reproduced negative result: guided
  minus unconditional resampling is -1.7 composite points, CI [-11.1, +7.3]. It varies
  three axes at once against MA+S — the gate, the delivery, and whether a role may
  retrieve — so it is a historical configuration rather than a single-variable contrast,
  and must be read as one. Retained because the composition it selects is still shipped.
