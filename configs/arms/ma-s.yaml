schema_version: 1
name: ma-s
label: MA+S
description: >
  MA plus the gated second opinion. The first diagnosis runs retrieval-free. A bounded,
  retrieval-free quality gate audits it against its own cited evidence and decides whether
  to look again. On a fire, two observation-keyed queries retrieve at most six precedent
  records; a fresh second diagnosis receives bounded summary cards of them and nothing
  from the first; a label-shuffled selector picks between the two. Any failure along the
  path falls back to the first answer. No nominator, and no retrieval tool in any role:
  the store is read by the harness only.
model_profile: qwen3.6-35b-a3b
frozen: true
registered:
  date: "2026-09-01"
  campaign: 2x2-replication
  hypothesis: "a gated second look carrying precedent text beats a single pass"
settings:
  pipeline:
    mode: multi
    max_turns: 100
    remediation_retries: 2
    auto_snapshot: true
  memory:
    enabled: true
    # The store is readable and no role holds a retrieval tool. That combination is the
    # arm: the harness searches for precedents while both diagnosis runs stay
    # retrieval-free, which is what makes the second run's precedent text the only thing
    # separating this arm from its content-test partner. The campaign states the same
    # narrowing in its own pre-registration: the memory factor is precedent text handed
    # to the second diagnosis under a quality gate, and no other delivery path is tested.
    role_retrieval: false
    learning_enabled: false
    top_k: 3
    # Pinned, and not to the shipped value. Kira floors a hit at 0.5 of its lexical score
    # per query token so retrieval can answer that nothing is comparable. The prototype
    # shipped that floor at zero and no archived environment sets it, so the cells this
    # arm reproduces admitted every text match; inheriting the floor would cut the
    # precedent dose the arm's result is read against.
    min_score_per_token: 0.0
    second_pass:
      enabled: true
      gate: quality
      delivery: context
      force: false
      # Six, not three: the two observation-keyed queries returned three hits each with
      # 0.51 mean overlap, for a merged mean of 5.49 precedents per cell. Pinning three
      # here would deliver roughly half the dose the published cells received.
      max_precedents: 6
      gate_max_tokens: 600
      selector_max_tokens: 1600
      selector_timeout_s: 180
  verify: {enabled: false}
holds_constant:
  - model_profile
  - runtime.*
  - pipeline.max_turns
  - pipeline.remediation_retries
  - verify.enabled
not_reproducible:
  - >
    The corpus. The published cells retrieved from so_gate_corpus_35b, 123 diagnosis
    records confirmed correct by external benchmark feedback and frozen for the campaign,
    under a per-problem leave-one-out exclusion supplied by the environment adapter. The
    corpus is not in this repository and the exclusion set is per incident, so this file
    configures the mechanism and cannot restore what it read.
notes: >
  Learning is off because the corpus is frozen for the campaign, so a test pass would add
  nothing to it. The lifecycle weighting is inherited rather than pinned: two archived
  environments set the invalidated weight to 0.3, which is the shipped default.
