schema_version: 1
name: ma-s
label: MA+S
description: >
  MA plus the gated second opinion. The first diagnosis runs retrieval-free. A bounded,
  retrieval-free quality gate audits it against its own cited evidence and decides whether
  to look again. On a fire, two observation-keyed queries retrieve at most six precedent
  records; a fresh second diagnosis receives bounded summary cards of them and nothing
  from the first; a label-shuffled selector picks between the two. Any failure along the
  path falls back to the first answer. No nominator, and no retrieval tool in any role:
  the store is read by the harness only.
model_profile: qwen3.6-35b-a3b
frozen: true
registered:
  date: "2026-08-12"
  campaign: sweep_20260812
  hypothesis: "a gated second look carrying precedent text beats a single pass"
settings:
  pipeline:   {mode: multi, max_turns: 20, remediation_retries: 2}
  memory:
    enabled: true
    # The store is readable and no role holds a retrieval tool. That combination is the
    # arm: the harness searches for precedents while both diagnosis runs stay
    # retrieval-free, which is what makes the second run's precedent text the only
    # thing separating this arm from the resampling control.
    role_retrieval: false
    learning_enabled: false
    playbook: false
    top_k: 3
    # Pinned, and not to the shipped value. Kira ranks an invalidated record at 0.3 of
    # its lexical score; the campaign this arm is frozen against never set that weight,
    # so its retrieval ranked invalidated and successful records alike. Reproducing the
    # campaign means saying so here rather than inheriting a default that has since
    # changed underneath it.
    lifecycle_weights: {invalidated: 1.0}
  verify:     {enabled: false}
  secondpass:
    enabled: true
    gate: quality
    delivery: context
    force: false
    # Six, not three: the two observation-keyed queries returned three hits each with
    # 0.51 mean overlap, for a merged mean of 5.49 precedents per cell. Pinning three
    # here would deliver roughly half the dose the published cells received.
    max_precedents: 6
    gate_max_tokens: 600
    selector_max_tokens: 1600
    selector_timeout_s: 180
  # Stated rather than inherited. The shipped default is `prompt`, because a
  # service holding cluster write permissions should not write unattended just
  # because nobody set a variable. An evaluation arm runs unattended by
  # definition, so it says so here — which also puts the value in the run's
  # configuration snapshot instead of leaving it to be inferred afterwards.
  authority:  {mode: auto}
holds_constant:
  - model_profile
  - runtime.*
  - pipeline.max_turns
  - pipeline.remediation_retries
  - verify.enabled
notes: >
  Learning is off because the corpus is frozen for the campaign, so a test pass would add
  nothing to it. The leave-one-out exclusion set is supplied by the environment adapter,
  not by this file.
