name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The file a reviewer without uv installs from. It is generated, so it drifts
      # silently, and the drift is only visible to the person whose environment no
      # longer matches the one this job tested.
      # Ignore comments, including indented dependency annotations: their ordering
      # does not affect installation. Versions, markers and hashes still must match.
      - name: requirements.txt matches the lock
        run: |
          uv export --format requirements-txt --frozen --no-dev -o /tmp/requirements.txt
          diff <(grep -v '^[[:space:]]*#' requirements.txt) \
               <(grep -v '^[[:space:]]*#' /tmp/requirements.txt) \
            || { echo "requirements.txt is stale: run make requirements"; exit 1; }
      # tests/unit/test_deploy.py renders both deploy overlays with `kubectl kustomize`,
      # which is local templating and contacts no cluster. Without the binary it would
      # skip, and a skipped check reports green, so it fails outright when CI is set —
      # this step is the whole reason it runs instead. Pinned to the version the runtime
      # image ships and checksummed the same way, so CI renders with the kustomize the
      # deployed kubectl carries rather than whatever the runner image happens to have.
      - name: kubectl, for the deploy manifest checks
        run: |
          version=$(grep -oP '(?<=^ARG KUBECTL_VERSION=)\S+' deploy/docker/Dockerfile)
          base="https://dl.k8s.io/release/${version}/bin/linux/amd64"
          curl -fsSL "${base}/kubectl" -o /tmp/kubectl
          curl -fsSL "${base}/kubectl.sha256" -o /tmp/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client
      # Deselects everything needing a live service. What needs a database is the
      # postgres job below; what needs a cluster runs nowhere, and says so.
      - run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  # The backend the evaluation campaigns run on. The unit suite covers the memory
  # ports and the contract suite covers this backend against them, but until this job
  # existed nothing ran an incident on it, and the gap between the two held a defect
  # that failed every incident here at its first role while the whole suite stayed
  # green. Running these only where a developer happens to have a server is how that
  # went unnoticed once already.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maver
          POSTGRES_PASSWORD: maver
          POSTGRES_DB: maver
        ports:
          - 5432:5432
        # The job starts as soon as the container does, which is before the server
        # accepts connections. Without this the first test races the database.
        options: >-
          --health-cmd "pg_isready -U maver -d maver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --all-extras for psycopg: without the driver these tests skip at import, which
      # is one of the two ways this job could report green having tested nothing. The
      # target's --no-skips is the other half, and turns any skip into a failure.
      - run: uv sync --all-extras --locked
      - run: make test-postgres
        env:
          POSTGRES_TEST_DSN: postgresql://maver:maver@localhost:5432/maver
